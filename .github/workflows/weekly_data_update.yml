name: Weekly Penghu Dataset & Weather Sync

on:
  schedule:
    # Berjalan otomatis setiap hari Senin pukul 03:00 UTC (11:00 Pagi Waktu Taiwan)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual kapan saja dari GitHub

jobs:
  update-penghu-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Fetch OpenStreetMap POIs
        run: python fetch_penghu_osm.py

      - name: 2. Fetch Taiwan Gov OpenData POIs
        run: python fetch_penghu_taiwan_opendata.py

      - name: 3. Merge Datasets & Wikipedia Metadata
        run: python merge_penghu_dataset.py

      - name: 4. Benchmark Weighting Schemes
        run: python benchmark_weighting_schemes.py

      - name: Commit & Push Updated Dataset
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo 'Tidak ada perubahan data baru.'
          else
            git commit -m 'chore(data): auto-sync weekly penghu master dataset [skip ci]'
            git push
          fi
